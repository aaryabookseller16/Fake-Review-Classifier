name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check src tests scripts app

      - name: Run tests
        run: pytest -q

      - name: Verify the app imports cleanly
        # Catches a broken import or a syntax error in the Streamlit app
        # without needing to boot a browser.
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('app/streamlit_app.py').read_text())"

  website:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test browser inference
        run: npm test

      - name: Verify production bundle
        run: npm run build
